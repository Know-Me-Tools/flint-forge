{{- if not .Values.secrets.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flint-forge.fullname" . }}-secrets
  labels:
    {{- include "flint-forge.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret | required "secrets.jwtSecret is required when existingSecretName is unset" | quote }}
{{- end }}
{{- if not .Values.postgres.existingSecretName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flint-forge.databaseSecretName" . }}
  labels:
    {{- include "flint-forge.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  username: {{ .Values.postgres.user | quote }}
  password: {{ .Values.postgres.password | required "postgres.password is required when postgres.existingSecretName is unset" | quote }}
  database: {{ .Values.postgres.database | quote }}
  {{- end }}
  database-url: {{ include "flint-forge.databaseUrl" . | quote }}
{{- end }}
